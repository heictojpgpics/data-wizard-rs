name: ReFS sample builder

on:
  push:
    branches: [main, draft]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: refs-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sample:
    name: Format a real ReFS volume and upload it
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Create and format the VHD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = "$env:TEMP\test_refs.vhd"
          $vhdScript = @"
          create vdisk file="$vhd" maximum=2048 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          assign letter=R
          exit
          "@
          $vhdScript | diskpart | Out-Null

          # ReFS rejects small volumes ("volume size is too small" below
          # ~1 GiB), hence the 2 GiB VHD; format via the storage cmdlets.
          $part = Get-Partition -DriveLetter R
          $label = Format-Volume -Partition $part -FileSystem ReFS -NewFileSystemLabel "TestReFS" -Confirm:$false -Force
          $label | Format-List | Out-String | Write-Host
          fsutil fsinfo volumeinfo R:

      - name: Populate the volume
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path R:\TestFiles -Force
          New-Item -ItemType Directory -Path R:\Docs -Force | Out-Null

          # 30 files with known, mappable content
          1..30 | ForEach-Object {
            $content = ("ReFS sample file $_ " + ("A" * 3000))
            [IO.File]::WriteAllText("R:\TestFiles\file$_.txt", $content)
          }
          [IO.File]::WriteAllText("R:\Docs\notes.txt", "important document " + ("B" * 5000))

          # A file with distinctive binary content for carving checks
          $bin = New-Object byte[] 65536
          for ($i = 0; $i -lt $bin.Length; $i++) { $bin[$i] = [byte](($i * 7) % 251) }
          [IO.File]::WriteAllBytes("R:\Docs\pattern.bin", $bin)

          # Distinct mtimes so the engine's timestamp decode is testable
          (Get-Item R:\Docs\notes.txt).LastWriteTime = [DateTime]::new(2025, 1, 2, 3, 4, 5)
          (Get-Item R:\Docs\pattern.bin).LastWriteTime = [DateTime]::new(2025, 6, 7, 8, 9, 10)

          # Delete 15 of the 30 (deep-pass material)
          1..15 | ForEach-Object { Remove-Item "R:\TestFiles\file$_.txt" }
          Get-ChildItem -Recurse R:\ | Select-Object FullName, Length | Out-String | Write-Host

      - name: Dump the raw volume (no VHD file needed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The VHD file handle is pinned by the stack long after detach
          # (survives vdsldr termination), so the artifact is a raw dump
          # of the attached volume itself: \.\R: first 128 MiB plus the
          # last 2 MiB, with a manifest carrying the volume length.
          $vol = New-Object IO.FileStream("\\.\R:", 'Open', 'Read', [IO.FileShare]::ReadWrite)
          # Stream the whole volume to a temp file first (CopyTo runs in
          # C#; PowerShell per-byte loops over 2 GiB would never finish),
          # then slice head 128 MiB + tail 2 MiB from it.
          $tmpAll = "$env:TEMP\refs-all.bin"
          $allFs = New-Object IO.FileStream($tmpAll, 'Create', 'Write')
          $vol.CopyTo($allFs)
          $allFs.Close()
          $vol.Close()
          $total = (Get-Item $tmpAll).Length

          $headFs = New-Object IO.FileStream("$env:TEMP\refs-head.bin", 'Create', 'Write')
          $inFs = New-Object IO.FileStream($tmpAll, 'Open', 'Read')
          $buf = New-Object byte[] (4MB)
          $left = [Math]::Min([int](128MB), $total)
          while ($left -gt 0) {
            $take = [Math]::Min($buf.Length, $left)
            $n = $inFs.Read($buf, 0, $take)
            if ($n -le 0) { break }
            $headFs.Write($buf, 0, $n)
            $left -= $n
          }
          $headFs.Close()

          $tailWant = [Math]::Min([int](2MB), $total)
          $inFs.Position = $total - $tailWant
          $tailFs = New-Object IO.FileStream("$env:TEMP\refs-tail.bin", 'Create', 'Write')
          while ($tailWant -gt 0) {
            $take = [Math]::Min($buf.Length, $tailWant)
            $n = $inFs.Read($buf, 0, $take)
            if ($n -le 0) { break }
            $tailFs.Write($buf, 0, $n)
            $tailWant -= $n
          }
          $tailFs.Close()
          $inFs.Close()
          Remove-Item $tmpAll -Force

          @{ volume_bytes = $total; head_bytes = 128MB; tail_bytes = 2MB } |
            ConvertTo-Json | Set-Content "$env:TEMP\refs-manifest.json"
          Get-Item "$env:TEMP\refs-*.bin" | Select-Object Name, Length | Out-String | Write-Host

      - name: Compress and upload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path "$env:TEMP\refs-head.bin", "$env:TEMP\refs-tail.bin", "$env:TEMP\refs-manifest.json" -DestinationPath refs-sample.zip
          $sum = (Get-FileHash refs-sample.zip -Algorithm SHA256).Hash
          "sha256 refs-sample.zip = $sum" | Write-Host

      - name: Upload sample
        uses: actions/upload-artifact@v4
        with:
          name: refs-sample-vhd
          path: refs-sample.zip
          retention-days: 30
          if-no-files-found: error
