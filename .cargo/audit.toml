# cargo-audit configuration.
# RUSTSEC-2023-0089 (atomic-polyfill "unmaintained") is pulled transitively
# via postcard 1.1.3 -> heapless ^0.7 (postcard pins heapless 0.7; heapless
# 0.8+ drops atomic-polyfill). The advisory is a maintenance notice, not a
# vulnerability; atomic-polyfill is a no-op passthrough on our targets
# (x86_64 has native atomics). Drop this ignore when postcard moves to
# heapless 0.8+.
[advisories]
ignore = ["RUSTSEC-2023-0089"]
