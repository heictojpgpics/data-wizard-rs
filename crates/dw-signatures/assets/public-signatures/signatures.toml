extension = "jpg"
mime = "image/jpeg"
header_offset = 0
header_magic = "FF D8 FF"
tail_offset = 0
tail_magic = "FF D9"
min_size = 4
max_size = 0
weight = 990
source = "GCF / Wikipedia: JPEG SOI (FF D8 FF) + EOI (FF D9)"

