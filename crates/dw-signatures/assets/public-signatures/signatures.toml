# Public-source file signatures for data-wizard-rs.
#
# This file is part of the dw-signatures crate. Every signature here is
# derived from a PUBLIC source — no proprietary data is used.
#
# Sources:
# - Gary Kessler's GCF "File Signatures Table" (https://www.garykessler.net/software/filemountains.txt)
# - NIST DFXML (https://github.com/dfxml-working-group/dfxml_schema)
# - Wikipedia "List of file signatures" (https://en.wikipedia.org/wiki/List_of_file_signatures)
# - libmagic (https://github.com/file/file)
#
# Each signature has a `source` field citing where the magic came from.
#
# Format: TOML array of tables. Fields:
#   extension      — file extension without leading dot, lowercase
#   mime           — MIME type (optional)
#   header_offset  — byte offset where header magic is expected
#   header_magic   — hex bytes of header magic (space-separated)
#   tail_offset    — offset from END of file where tail magic is expected (0 = no tail)
#   tail_magic     — hex bytes of tail magic (omitted if tail_offset = 0)
#   min_size       — minimum file size in bytes (0 = no minimum)
#   max_size       — maximum file size in bytes (0 = unlimited)
#   weight         — confidence weight 0..=1000 (higher = more confident)
#   source         — citation for this signature

# ===== Images =====

