header_offset = 0
header_magic = "02 00 5A 57 52 54 00 00 00 00 00 00 00 00 00 00"
tail_offset = 0
min_size = 32
max_size = 0
weight = 950
source = "Wikipedia List of file signatures: Claris Works word processing doc"

