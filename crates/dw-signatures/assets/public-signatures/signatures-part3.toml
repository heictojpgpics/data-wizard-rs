# Public-source file signatures for dw-signatures (part 3).
#
# EVERY entry in this file is derived verbatim from the Wikipedia
# "List of file signatures" table (https://en.wikipedia.org/wiki/List_of_file_signatures),
# fetched and parsed on 2026-10-16. The `source` field of each entry quotes the
# table row description. No proprietary data is used.
#
# Fields follow the same schema as signatures.toml. Weights are computed
# from magic length (500 + 75 * len, capped at 950) — longer magic,
# higher confidence. min_size = magic length + 16. max_size = 0 (the
# carver applies its own analysis cap).

