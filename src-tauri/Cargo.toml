# Standalone workspace root: this package is deliberately outside the
# library workspace (it pulls the Tauri 2 tree, which would break the
# light-weight lib CI jobs). The CLI for scanning images/volumes is
# `dw-scantool` (bin `dw-scan`) in the main workspace; this crate is the
# GUI shell only.
#
# NOTE: the workspace dependencies table below is a synchronized copy of
# the root workspace's table (keep both in sync).
[workspace]
members = ["."]

[workspace.dependencies]
# Internal
dw-core       = { path = "../crates/dw-core" }
dw-disk       = { path = "../crates/dw-disk" }
dw-ntfs       = { path = "../crates/dw-ntfs" }
dw-fat        = { path = "../crates/dw-fat" }
dw-exfat      = { path = "../crates/dw-exfat" }
dw-ext        = { path = "../crates/dw-ext" }
dw-hfs        = { path = "../crates/dw-hfs" }
dw-btrfs      = { path = "../crates/dw-btrfs" }
dw-zfs        = { path = "../crates/dw-zfs" }
dw-refs       = { path = "../crates/dw-refs" }
dw-signatures = { path = "../crates/dw-signatures" }
dw-carver     = { path = "../crates/dw-carver" }
dw-ipc        = { path = "../crates/dw-ipc" }

# Core async / utils
tokio = { version = "1.47", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
flume = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "2.1"
toml = "0.9"
postcard = { version = "1.1", features = ["use-std"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Crypto / hashing
blake3 = { version = "1.8", features = ["pure"] }
sha2 = "0.10"
crc32fast = "1.4"
crc = "3.3"

# Time
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
jiff = "0.2"

# Memory-mapped I/O
memmap2 = "0.9"

# Byteorder / parsing
bytemuck = { version = "1.23", features = ["derive", "min_const_generics"] }
byteorder = "1.5"
bytes = "1.10"
bytesize = "2.1"

# UUIDs
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }

# Tauri 2
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }


[package]
name = "dw-tauri"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/heictojpgpics/data-wizard-rs"
description = "Tauri 2 shell for data-wizard-rs"
default-run = "dw-tauri"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
dw-core        = { workspace = true }
dw-disk        = { workspace = true }
dw-ipc         = { workspace = true }
dw-ntfs        = { workspace = true }
dw-fat         = { workspace = true }
dw-exfat       = { workspace = true }
dw-ext         = { workspace = true }
dw-hfs         = { workspace = true }
dw-btrfs     = { workspace = true }
dw-zfs       = { workspace = true }
dw-refs      = { workspace = true }
dw-signatures  = { workspace = true }
dw-carver      = { workspace = true }
tauri          = { workspace = true }
tauri-plugin-dialog       = { workspace = true }
tauri-plugin-opener      = { workspace = true }
tauri-plugin-window-state = { workspace = true }
specta          = { workspace = true, features = ["derive"] }
tauri-specta    = { workspace = true, features = ["derive", "typescript"] }
specta-typescript = { workspace = true }
tokio          = { workspace = true }
async-trait    = { workspace = true }
parking_lot    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
anyhow         = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
uuid           = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }
